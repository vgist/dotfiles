#!/usr/sbin/nft -f
#
flush ruleset

# Interfaces must be initialized before nftables loads (required by netdev hook)
table netdev filter {
  chain ingress {
    type filter hook ingress devices = { "eth0" } priority -500; policy accept;
    jump ingress_filter
  }
  chain ingress_filter {
    ip frag-off & 0x1fff != 0 counter drop
    tcp flags & (fin|syn|rst|psh|ack|urg) == fin|syn|rst|psh|ack|urg counter drop
    tcp flags & (fin|syn|rst|psh|ack|urg) == 0x0 counter drop
    tcp flags syn tcp option maxseg size 1-535 counter drop
  }
}

table inet filter {
  chain input {
    type filter hook input priority filter; counter; policy drop;
    jump base_filter
    jump other_filter
  }

  chain base_filter {
    ct state vmap { established: accept, related: accept, invalid: drop }
    # Allow loopback traffic
    iifname "lo" accept
  }

  chain other_filter {
  }
}

include "/etc/nftables.conf.d/*.nft"
